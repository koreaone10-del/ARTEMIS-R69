services:
  - type: web
    name: artemis-r69-v6
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AI_BASE_URL
        value: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
      - key: AI_MODEL
        value: gpt-oss-20b
